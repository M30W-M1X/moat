name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, sign, and publish release
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27.0"
          cache: true

      - uses: sigstore/cosign-installer@v4.1.3

      - name: Install image build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends e2fsprogs podman curl

      - name: Run unit tests
        run: go test -race -count=1 ./...

      - name: Build and verify reproducible images
        run: make images-verify

      - name: Assemble and sign release
        env:
          VERSION: ${{ github.ref_name }}
          SIGN: "1"
        run: build/release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          NOTES="$(git tag -l --format='%(contents:body)' "$TAG")"
          if [ -n "$NOTES" ]; then
            gh release create "$TAG" \
              --title "Moat $TAG" \
              --latest \
              --notes "$NOTES" \
              "dist/moat_${TAG}_linux_amd64.tar.gz" \
              dist/checksums.txt \
              dist/checksums.txt.sig \
              dist/checksums.txt.bundle
          else
            gh release create "$TAG" \
              --title "Moat $TAG" \
              --latest \
              --generate-notes \
              "dist/moat_${TAG}_linux_amd64.tar.gz" \
              dist/checksums.txt \
              dist/checksums.txt.sig \
              dist/checksums.txt.bundle
          fi
