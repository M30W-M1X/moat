name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build, sign, and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
          cache: true

      - uses: sigstore/cosign-installer@v3

      - name: Install image build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends e2fsprogs podman curl

      - name: Run unit tests
        run: go test -race -count=1 ./...

      - name: Build and verify reproducible images
        run: make images-verify

      - name: Assemble and sign release
        env:
          VERSION: ${{ github.ref_name }}
          SIGN: "1"
        run: build/release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/moat_${{ github.ref_name }}_linux_amd64.tar.gz \
            dist/checksums.txt \
            dist/checksums.txt.sig \
            dist/checksums.txt.bundle \
            --generate-notes
